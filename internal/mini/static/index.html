<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Both themes are supported. Without this the browser paints form controls
       for a light page and inputs come out white on the dark theme. -->
  <meta name="color-scheme" content="light dark">
  <title>Family Hub</title>
  <!-- Served from /mini/assets/ rather than the site root: the root is behind
       oauth, and the Mini App is the one surface that must load without it. -->
  <link rel="icon" href="/mini/assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/mini/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/mini/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/mini/assets/style.css?v=__V__">
  <!-- Telegram's own SDK; it must come from their origin, it is what injects
       window.Telegram.WebApp. Everything else is served from this app. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/mini/assets/app.js?v=__V__"></script>
</body>
</html>
