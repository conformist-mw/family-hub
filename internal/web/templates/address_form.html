{{define "content"}}
{{$d := .Data}}
<div class="page-head">
  <h1>{{if $d.IsEdit}}{{$d.Address.Name}}{{else}}Нова адреса{{end}}</h1>
</div>

{{if $d.Error}}<div class="flash">{{$d.Error}}</div>{{end}}

<form class="stack" method="post"
      action="{{if $d.IsEdit}}/meters/addresses/{{$d.Address.ID}}{{else}}/meters/addresses/new{{end}}">
  <label>Назва
    <input type="text" name="name" value="{{$d.Address.Name}}" required>
  </label>
  <label>Адреса
    <input type="text" name="comment" value="{{$d.Address.Comment}}">
  </label>
  <div class="row">
    {{/* Площа is only needed by tariffs charged per square metre. */}}
    <label>Площа, м²
      <input type="text" inputmode="decimal" name="area" value="{{num $d.Address.Area}}">
    </label>
    <label>Валюта
      <input type="text" name="currency" value="{{$d.Address.Currency}}">
    </label>
    <label>Порядок
      <input type="number" name="sort_order" value="{{$d.Address.SortOrder}}">
    </label>
  </div>
  <div class="form-actions">
    <button class="btn primary" type="submit">Зберегти</button>
    <a class="btn" href="/meters/addresses">Скасувати</a>
  </div>
</form>
{{end}}
