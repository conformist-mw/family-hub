{{define "base"}}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Доп. занятия</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Доп. занятия</a>
    <nav>
      <a href="/" class="{{if eq .Active "dashboard"}}active{{end}}">Баланс</a>
      <a href="/visits" class="{{if eq .Active "visits"}}active{{end}}">Занятия</a>
      <a href="/appointments" class="{{if eq .Active "appointments"}}active{{end}}">Записи</a>
      <a href="/payments" class="{{if eq .Active "payments"}}active{{end}}">Оплаты</a>
      <a href="/stats" class="{{if eq .Active "stats"}}active{{end}}">Статистика</a>
      <a href="/enrollments" class="{{if eq .Active "enrollments"}}active{{end}}">Курсы</a>
      <a href="/trainers" class="{{if eq .Active "trainers"}}active{{end}}">Тренеры</a>
    </nav>
  </header>
  <main>
    {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
