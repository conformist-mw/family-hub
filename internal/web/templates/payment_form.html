{{define "content"}}
{{$d := .Data}}
{{$p := $d.Payment}}
<div class="page-head">
  <h1>{{if $d.IsEdit}}Оплата{{else}}Нова оплата{{end}}</h1>
</div>

{{if $d.Error}}<div class="flash" style="background:#fee2e2;border-color:#fecaca;color:#991b1b">{{$d.Error}}</div>{{end}}

<form class="stack" method="post" action="{{if $d.IsEdit}}/payments/{{$p.ID}}{{else}}/payments{{end}}">
  <label>
    Курс
    <select name="enrollment_id" id="enrollment" required>
      <option value="">— вибери —</option>
      {{range $d.Enrollments}}
      <option value="{{.ID}}" data-billing="{{.BillingType}}" data-price="{{.CurrentPrice}}"
        {{if eq .ID $p.EnrollmentID}}selected{{end}}>{{.Person}} — {{classLabel .Name .Description}} ({{billingLabel .BillingType}}){{if not .Active}} (архів){{end}}</option>
      {{end}}
    </select>
  </label>

  <label>
    Дата оплати
    <input type="date" name="date" value="{{$p.Date}}" required>
  </label>

  <label>
    Сума, ₴
    <input type="number" name="amount" step="0.01" min="0" value="{{if $p.Amount}}{{$p.Amount}}{{end}}" required>
  </label>

  <div id="block-lesson" class="billing-block">
    <label>
      Оплачено занять
      <input type="number" name="lessons_paid" step="1" min="1" value="{{if $p.LessonsPaid}}{{$p.LessonsPaid}}{{end}}">
    </label>
  </div>

  <div id="block-monthly" class="billing-block" hidden>
    <label>
      Абонемент з
      <input type="date" name="covers_from" value="{{deref $p.CoversFrom}}">
    </label>
    <label>
      Абонемент до
      <input type="date" name="covers_until" value="{{deref $p.CoversUntil}}">
    </label>
  </div>

  <label>
    Комментар
    <textarea name="comment" placeholder="необов’язково">{{$p.Comment}}</textarea>
  </label>

  <div class="form-actions">
    <button class="btn primary" type="submit">Зберегти</button>
    <a class="btn" href="/payments">Скасувати</a>
  </div>
</form>

{{if $d.IsEdit}}
<form method="post" action="/payments/{{$p.ID}}/delete" onsubmit="return confirm('Видалити оплату?')" style="margin-top:14px">
  <button class="btn danger" type="submit">Видалити оплату</button>
</form>
{{end}}

<script>
  (function () {
    var sel = document.getElementById('enrollment');
    var lesson = document.getElementById('block-lesson');
    var monthly = document.getElementById('block-monthly');
    function toggle() {
      var opt = sel.options[sel.selectedIndex];
      var billing = opt ? opt.dataset.billing : '';
      var isMonthly = billing === 'monthly';
      monthly.hidden = !isMonthly;
      lesson.hidden = isMonthly;
    }
    sel.addEventListener('change', toggle);
    toggle();
  })();
</script>
{{end}}
