{{define "content"}}
{{$d := .Data}}
{{$p := $d.Payment}}
<div class="page-head">
  <h1>{{if $d.IsEdit}}Оплата{{else}}Нова оплата{{end}}</h1>
</div>

{{if $d.Error}}<div class="flash error">{{$d.Error}}</div>{{end}}

<form class="stack" method="post" action="{{if $d.IsEdit}}/lessons/payments/{{$p.ID}}{{else}}/lessons/payments{{end}}">
  <label>
    Курс
    <select name="enrollment_id" id="enrollment" required>
      <option value="">— вибери —</option>
      {{range $d.Enrollments}}
      <option value="{{.ID}}" data-billing="{{.BillingType}}" data-price="{{.CurrentPrice}}"
        {{if eq .ID $p.EnrollmentID}}selected{{end}}>{{.Person}} — {{classLabel .Name .Description}} ({{billingLabel .BillingType}}){{if not .Active}} (архів){{end}}</option>
      {{end}}
    </select>
  </label>

  <fieldset class="kind-switch">
    <legend>Що це</legend>
    <label class="radio">
      <input type="radio" name="kind" value="course" {{if ne $p.Kind "extra"}}checked{{end}}>
      За заняття
    </label>
    <label class="radio">
      <input type="radio" name="kind" value="extra" {{if eq $p.Kind "extra"}}checked{{end}}>
      Додатково
    </label>
  </fieldset>

  <label>
    Дата оплати
    <input type="date" name="date" value="{{$p.Date}}" required>
  </label>

  <label>
    Сума, ₴
    <input type="number" name="amount" step="0.01" min="0" value="{{if $p.Amount}}{{$p.Amount}}{{end}}" required>
  </label>

  <div id="block-lesson" class="billing-block">
    <label>
      Оплачено занять
      <input type="number" name="lessons_paid" step="1" min="1" value="{{if $p.LessonsPaid}}{{$p.LessonsPaid}}{{end}}">
    </label>
  </div>

  <div id="block-extra" class="billing-block" hidden>
    <label>
      За що
      <input type="text" name="label" value="{{$p.Label}}" placeholder="Кімоно, форма, поїздка…">
    </label>
  </div>

  <div id="block-monthly" class="billing-block" hidden>
    <label>
      За який місяць <span class="muted">(не плутати з датою переказу вище)</span>
      <input type="month" name="covers_month" value="{{$p.CoversMonth}}">
    </label>
  </div>

  <label>
    Комментар
    <textarea name="comment" placeholder="необов’язково">{{$p.Comment}}</textarea>
  </label>

  <div class="form-actions">
    <button class="btn primary" type="submit">Зберегти</button>
    <a class="btn" href="/lessons/payments">Скасувати</a>
  </div>
</form>

{{if $d.IsEdit}}
<form method="post" action="/lessons/payments/{{$p.ID}}/delete" onsubmit="return confirm('Видалити оплату?')" style="margin-top:14px">
  <button class="btn danger" type="submit">Видалити оплату</button>
</form>
{{end}}

<script>
  (function () {
    var sel = document.getElementById('enrollment');
    var lesson = document.getElementById('block-lesson');
    var monthly = document.getElementById('block-monthly');
    var extra = document.getElementById('block-extra');
    var kinds = document.querySelectorAll('input[name="kind"]');
    function selectedKind() {
      for (var i = 0; i < kinds.length; i++) {
        if (kinds[i].checked) return kinds[i].value;
      }
      return 'course';
    }
    // The kind decides first: an extra buys neither lessons nor a month, so
    // the course's billing type says nothing about which field to ask for.
    function toggle() {
      var isExtra = selectedKind() === 'extra';
      extra.hidden = !isExtra;
      if (isExtra) {
        lesson.hidden = true;
        monthly.hidden = true;
        return;
      }
      var opt = sel.options[sel.selectedIndex];
      var isMonthly = (opt ? opt.dataset.billing : '') === 'monthly';
      monthly.hidden = !isMonthly;
      lesson.hidden = isMonthly;
    }
    sel.addEventListener('change', toggle);
    for (var i = 0; i < kinds.length; i++) kinds[i].addEventListener('change', toggle);
    toggle();
  })();
</script>
{{end}}
