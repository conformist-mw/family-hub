{{define "content"}}
{{$d := .Data}}
<div class="page-head">
  <h1>{{if $d.IsEdit}}Заняття{{else}}Нове заняття{{end}}</h1>
</div>

{{if $d.Error}}<div class="flash error">{{$d.Error}}</div>{{end}}

<form class="stack" method="post" action="{{if $d.IsEdit}}/lessons/visits/{{$d.Visit.ID}}{{else}}/lessons/visits{{end}}">
  <label>
    Курс
    {{if $d.Frequent}}
    <div class="pick-chips" id="enrollment-chips">
      {{range $d.Frequent}}
      <button type="button" data-eid="{{.ID}}">{{.Person}} · {{classLabel .Name .Description}}</button>
      {{end}}
    </div>
    {{end}}
    <select name="enrollment_id" id="enrollment" required>
      <option value="">— вибери —</option>
      {{range $d.Enrollments}}
      <option value="{{.ID}}" {{if eq .ID $d.Visit.EnrollmentID}}selected{{end}}>{{.Person}} — {{classLabel .Name .Description}}{{if not .Active}} (архів){{end}}</option>
      {{end}}
    </select>
  </label>

  <label>
    Дата
    <input type="date" name="date" id="date" value="{{$d.Visit.Date}}" required>
    <div class="date-quick">
      <button type="button" data-date="{{$d.Today}}">сьогодні</button>
      <button type="button" data-date="{{$d.Yesterday}}">вчора</button>
      <button type="button" data-date="{{$d.Before}}">позавчора</button>
    </div>
  </label>

  <label>
    Статус
    <select name="status" required>
      {{range $d.Statuses}}
      <option value="{{.Code}}" {{if eq .Code $d.Visit.Status}}selected{{end}}>{{.Label}}</option>
      {{end}}
    </select>
  </label>

  <label>
    Комментар
    {{if $d.Reasons}}
    <div class="pick-chips" id="reason-chips">
      {{range $d.Reasons}}
      <button type="button" data-reason="{{.}}">{{.}}</button>
      {{end}}
    </div>
    {{end}}
    <textarea name="comment" id="comment" placeholder="необов’язково">{{$d.Visit.Comment}}</textarea>
  </label>

  <div class="form-actions">
    <button class="btn primary" type="submit">Зберегти</button>
    <a class="btn" href="/lessons/visits">Скасувати</a>
  </div>
</form>

{{if $d.IsEdit}}
<form method="post" action="/lessons/visits/{{$d.Visit.ID}}/delete" onsubmit="return confirm('Видалити запис?')" style="margin-top:14px">
  <button class="btn danger" type="submit">Видалити запис</button>
</form>
{{end}}

<script>
  document.querySelectorAll('.date-quick button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById('date').value = b.dataset.date;
    });
  });

  (function () {
    var sel = document.getElementById('enrollment');
    var chips = document.querySelectorAll('#enrollment-chips button');
    function sync() {
      chips.forEach(function (c) {
        c.classList.toggle('active', c.dataset.eid === sel.value);
      });
    }
    chips.forEach(function (c) {
      c.addEventListener('click', function () {
        var eid = c.dataset.eid;
        Array.prototype.forEach.call(sel.options, function (o) {
          o.selected = (o.value === eid);
        });
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      });
    });
    sel.addEventListener('change', sync);
    sync();
  })();

  document.querySelectorAll('#reason-chips button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById('comment').value = b.dataset.reason;
    });
  });
</script>
{{end}}
